name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or unpatched vulnerability details. Use the repository's private security-reporting route for security issues.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected release or commit when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, deployment, and configuration details with secrets removed.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or additional evidence
      description: Paste only sanitized evidence needed to understand the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This report does not disclose a security vulnerability or private data.
          required: true

